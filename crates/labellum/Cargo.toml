[package]
name = "labellum"
description = "API server of Orchid: stores the desired state of the cluster in etcd"
readme = "README.md"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# An in-process Labellum on an in-memory store, for tests of the other components.
testing = []

[dependencies]
clap.workspace = true
gethostname.workspace = true
ipnet.workspace = true
jiff.workspace = true
orchid-api.workspace = true
orchid-proto.workspace = true
orchid-store.workspace = true
orchid-transport.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-stream.workspace = true
tokio-util.workspace = true
toml.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-util.workspace = true
labellum = { path = ".", features = ["testing"] }
orchid-client.workspace = true
orchid-transport = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "test-util"] }
