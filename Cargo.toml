[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
orchid-api = { path = "crates/orchid-api" }
orchid-proto = { path = "crates/orchid-proto" }
orchid-store = { path = "crates/orchid-store" }

etcd-client = { version = "0.20", features = ["tls"] }
futures-core = "0.3"
futures-util = "0.3"
humantime = "2"
ipnet = { version = "2", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
